version: "3.9"
services:
  postgres:
    image: postgres:16-alpine
    container_name: markethub_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: markethub
      POSTGRES_PASSWORD: markethub_pass
      POSTGRES_DB: markethub
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: markethub_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  pgdata:
